{% extends 'quiz/create_quiz.html' %}
{% block content %}

<div class="col-md-8 offset-md-2">
    <input type="text" name="quiz_id" value="{{ quiz_id }}" style="display: none">
      {% for q in question %}
        dd
          <li>
            <a href="" class="">{{ q._id }}</a>
          </li>
        </li>

          <li>
          Вопрос
          </li>
            {{ q.question_instance.text }}

          <li>
          Ответ
          </li>
        {{ q.answer_instance.text }}

      <li>
        Результат
          </li>
      {{ q.correct }}
       {% endfor %}

</div>
{% endblock %}
