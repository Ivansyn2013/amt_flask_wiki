{% extends 'quiz/show_quizzs.html' %}

{% block content %}
  <div class="col-md-8 offset-md-2">
    <h2 class="mb-5">Назначенные мне тесты</h2>
    {% for quiz in list_quizs %}
      <li>

            <a href="{{ url_for('wiki.quiz_play', quiz_id=quiz._id) }}">{{ quiz.name }}</a>

      </li>
    {% endfor %}
  </div>
{% endblock %}
