<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {{ bootstrap.load_css() }}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="{{ url_for('wiki.static', filename='css/font-awesome.min.css') }}" rel="stylesheet" />
  <link href="{{ url_for('wiki.static', filename='css/wiki.css') }}" rel="stylesheet" />

  <link href="{{ url_for('wiki.static', filename='css/quiz/quiz.css') }}" rel="stylesheet"/>
  <title>Тест</title>
</head>
<body>
<div class="container text-center custom-div-size" >
  <h2>Тест </h2>
  <div class="container d-flex flex-column align-items-center justify-content-center">
    <h3>Название теста</h3>
    <div style="width: 60%;" class="row row-cols-2 bg-info d-flex align-items-center mb-4">
        <div class="form-check mb-2 d-flex">
          <input type="radio" class="form-check-input" name="answers" id="answer1">
          <label for="answer1" class="form-check-label">Первый</label>
        </div>
        <div class="form-check d-flex">
          <input type="radio" class="form-check-input" name="answers" id="answer2">
          <label for="answer2" class="form-check-label">Второй</label>
        </div>
        <div class="form-check d-flex">
          <input type="radio" class="form-check-input" name="answers" id="answer3">
          <label for="answer3" class="form-check-label">Третий</label>
        </div>
        <div class="form-check d-flex">
          <input type="radio" class="form-check-input" name="answers" id="answer4">
          <label for="answer4" class="form-check-label">Четвертый</label>
        </div>


    </div>
    <button class="btn-primary"> Ответить </button>
  </div>
</div>




  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
