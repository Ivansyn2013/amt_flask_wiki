version: '3.9'
services:
  nginx_amt_wiki_ver2:
    image: nginx:1.23-alpine
    container_name: nginx_education
    ports:
      - "80:80"
    volumes:
      - "./nginx/nginx-test-serv.conf:/etc/nginx/conf.d/default.conf"
      - "../tmp_big_files/:/tmp_big_files"
    depends_on:
      - app_amt_wiki
    networks:
      - amt_education_net

  app_amt_wiki:
    build:
      dockerfile: Dockerfile
      context: .

    image: amt_wiki:3.0.0
    container_name: amt_wiki
    env_file:
      - ".env"
    volumes:
      - "/home/amt_user/amt_wiki/data:/app/data"
    expose:
      - "5006"
    networks:
      - amt_education_net
    working_dir: /app
    command: poetry run gunicorn --workers=4 wsgi:app -b 0.0.0.0:5006

networks:
  amt_education_net:
    name: amt_education_net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.18.0.0/16
