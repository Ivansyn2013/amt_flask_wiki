#      - amt_education_net
    #command:
     # ["bash", "-c", "psql -U $PGUSER -d $PGDB -f /db_backs/2024-03-23-wiki-backup.sql"]

networks:
  amt_education_net:
    name: amt_education_net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.18.0.0/16