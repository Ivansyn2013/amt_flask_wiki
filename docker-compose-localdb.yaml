version: "3.9"
services:
  local_amt_db:
    container_name: local_amt_db
    image: postgres:13-alpine3.18
    volumes:
      - './db_backs/2024-04-06-wiki-backup.sql:/db_backs/2024-04-06-wiki-backup.sql'
      - './scripts:/db_entripoints'
    env_file:
      - .env
    ports:
      - "${PGPORT}:${PGPORT}"
