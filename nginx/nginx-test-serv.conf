   # === БЛОКИРУЮЩИЕ LOCATION (в конце) ===

    # 4. Защита скрытых файлов
  location ~ /\. {
      set $rule_matched "safe";
      deny all;
      access_log off;
      log_not_found off;
      return 404;
  }

  # 5. Защита по расширениям
  location ~* \.(env|ini|conf|sql|bak|log|sh|key)$ {
      set $rule_matched "safe";
      deny all;
      access_log off;
      log_not_found off;
      return 404;
  }

    # 6. Защита директорий
  location ~ /(\.git|vendor|node_modules|logs) {
      set $rule_matched "safe";
      deny all;
      access_log off;
      log_not_found off;
      return 404;
  }
}



