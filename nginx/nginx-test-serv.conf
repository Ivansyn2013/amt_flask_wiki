upstream app_amt_wiki_ver3 {
  #server app_amt_wiki:5006;
  server 172.18.0.1:5000;
  }


log_format detailed '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'rule: $rule_matched';


server {
  listen 80;
  server_name _;


  access_log /var/log/nginx/access.log detailed;

  set $rule_matched "default";
  include  /etc/nginx/mime.types;
  client_max_body_size 1000M;
  client_body_in_file_only clean;
  client_body_temp_path /tmp_big_files;
  client_body_timeout 120s;

  proxy_request_buffering off;

  location / {
      set $rule_matched "base";
      proxy_pass http://app_amt_wiki_ver3;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
      proxy_redirect off;
  }

  location /wiki/files/ {
    internal;
    include  /etc/nginx/mime.types;
    root /app/media;

    expires 1d;
    add_header Cache-Control "private";
    add_header Accept-Ranges bytes;

  }

  location /static/ {
    alias /app/static/;
    add_header Cache-Control "public, immutable";
    }

  location /admin/static/ {
    alias /app/admin/static/;
    add_header Cache-Control "public, immutable";
    }

  location /favicon.ico {
    alias /app/static/favicon.ico;
    add_header Cache-Control "public, immutable";
  }

