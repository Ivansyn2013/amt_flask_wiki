upstream app_amt_wiki_ver3 {
  #server app_amt_wiki:5006;
  server 172.18.0.1:5000;
  }


log_format detailed '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rule: $rule_matched'
                    'file: $request_filename '
                    'uri: $uri '
                    'accel: $upstream_http_x_accel_redirect';


server {
  listen 80;
  server_name _;


  access_log /var/log/nginx/access.log detailed;

  set $rule_matched "default";
  include  /etc/nginx/mime.types;
  client_max_body_size 1000M;
  client_body_in_file_only clean;
  client_body_temp_path /tmp_big_files;
  client_body_timeout 120s;

  proxy_request_buffering off;

  location / {
      set $rule_matched "base";
      include  /etc/nginx/mime.types;
      proxy_pass http://app_amt_wiki_ver3;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
      proxy_redirect off;
      access_log /var/log/nginx/access.log detailed;

      proxy_hide_header Content-Type;
      proxy_hide_header Content-Disposition;
#       proxy_ignore_headers Content-Type;
  }

  location /wiki/static/ {
    alias /app/static/;
    add_header Cache-Control "public, immutable";
  }

  location ~ ^/wiki/files/([^/]+)$ {
    set $rule_matched "proxy_files";
    proxy_pass http://app_amt_wiki_ver3;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_redirect off;


    proxy_pass_request_headers on;
    proxy_hide_header X-Accel-Redirect;

    expires 1d;
  }

  location ~ ^/internal_files/([^/]+)$ {
    set $rule_matched "files internal";
    internal;

    include  /etc/nginx/mime.types;
    access_log /var/log/nginx/access.log detailed;
    root /app/media;
    try_files /$1 =404;

    # Поддержка стриминга (важно для видео)
    expires 1d;
    add_header Cache-Control "private";
  }

  location /static/ {
    alias /app/static/;
    add_header Cache-Control "public, immutable";
    }

  location /admin/static/ {
    alias /app/admin/static/;
    add_header Cache-Control "public, immutable";
    }

  location /favicon.ico {
    alias /app/static/favicon.ico;
    add_header Cache-Control "public, immutable";
  }


   # === БЛОКИРУЮЩИЕ LOCATION (в конце) ===

    # 4. Защита скрытых файлов
  location ~ /\. {
      set $rule_matched "safe";
      deny all;
      access_log off;
      log_not_found off;
      return 404;
  }

  # 5. Защита по расширениям
  location ~* \.(env|ini|conf|sql|bak|log|sh|key)$ {
      set $rule_matched "safe";
      deny all;
      access_log off;
      log_not_found off;
      return 404;
  }

    # 6. Защита директорий
  location ~ /(\.git|vendor|node_modules|logs) {
      set $rule_matched "safe";
      deny all;
      access_log off;
      log_not_found off;
      return 404;
  }
}



